],
actions: [
  ["Фолд", "fold, пас, сброс, фолдить, сбросить карты", "Фолд — сброс карт: ты выходишь из раздачи и теряешь всё, что уже вложил в [[Банк|банк]]. Фолдить имеет смысл, только когда тебе нужно отвечать на ставку: если можно бесплатно сделать [[Чек|чек]], сбрасывать карты незачем. Большинство стартовых рук правильно выбрасывать ещё до флопа, например {7c 2d} на UTG. Вовремя сброшенная рука экономит фишки, которые иначе ушли бы на коллы в безнадёжных ситуациях."],
  ["Чек", "check, чекать, чекнуть, пропустить ход", "Чек — пропуск хода без ставки: ты остаёшься в раздаче, не добавляя фишек в банк. Чекнуть можно, только если на текущей [[Улицы|улице]] ещё никто не ставил. Префлоп чек доступен [[Большой блайнд|большому блайнду]], когда до него никто не повышал. Чеком смотрят следующую карту бесплатно, держат банк маленьким или провоцируют соперника на ставку, чтобы ответить [[Чек-рейз|чек-рейзом]]."],
  ["Колл", "call, уравнять, коллировать, заколлировать, коллить", "Колл — уравнивание текущей ставки: ты доводишь свой вклад на этой улице до ставки соперника и продолжаешь раздачу. Например, CO открылся до 2,5 bb, ты на [[Баттон|баттоне]] ставишь те же 2,5 bb и видишь флоп в позиции. Решение о колле опирается на [[Шансы банка|шансы банка]]: чем дешевле колл относительно банка, тем реже тебе нужно выигрывать, чтобы он окупался."],
  ["Бет", "bet, ставка, бетить, бетнуть, поставить", "Бет — первая ставка на улице, когда до тебя никто не ставил. Бетом ты хочешь получить колл от худших рук ([[Вэлью-бет|вэлью-бет]]) или фолд от лучших ([[Блеф|блеф]]). Префлоп первой ставкой считается большой блайнд, поэтому там говорят не «бет», а «рейз». Размер бета ([[Сайзинг|сайзинг]]) обычно считают в долях банка: треть, половина, весь банк."],
  ["Рейз", "raise, повышение, рейзить, ререйз, зарейзить", "Рейз — повышение уже сделанной ставки: вместо колла ты ставишь больше. Прибавка по правилам должна быть не меньше предыдущей ставки или повышения — это [[Минимальный рейз|минимальный рейз]]. Префлоп стандартный опен-рейз, то есть рейз, которым ты первым входишь в банк, — 2,5 bb: большой блайнд уже считается ставкой в 1 bb, и ты её повышаешь. Рейз даёт два способа выиграть: соперник сбрасывает сразу или проигрывает на [[Шоудаун|шоудауне]]."],
  ["3-бет", "3-bet, 3bet, трибет, три-бет, трёхбет, 3бет", "3-бет — первое повышение после опен-рейза префлоп. Название идёт от счёта ставок: [[Большой блайнд|большой блайнд]] — первая, опен — вторая, повышение поверх опена — третья. Например, CO открывается до 2,5 bb, ты на баттоне делаешь 3-бет до 8 bb. В позиции 3-бет обычно втрое больше опена, без позиции — вчетверо. Его ставят с сильными руками ради вэлью и с частью рук с [[Блокеры|блокерами]], например A5s, как блеф."],
  ["4-бет", "4-bet, 4bet, фобет, фор-бет, четырёхбет, 4бет", "4-бет — повышение в ответ на [[3-бет]] префлоп, четвёртая ставка по счёту. Пример: ты открываешься на CO до 2,5 bb, баттон делает 3-бет до 8 bb, ты повышаешь до 20 bb. Обычно 4-бет в 2,2–2,5 раза больше 3-бета. При стеках 100 bb его диапазон узкий: AA, KK, QQ, AK и немного блефов вроде A5s, где туз в руке снижает шанс, что у соперника AA или AK. Следующий шаг — 5-бет, чаще всего это уже [[Олл-ин|олл-ин]]."],
  ["Лимп", "limp, лимпить, лимпер, open-limp, залимпить", "Лимп — вход в раздачу префлоп простым коллом большого блайнда вместо рейза. Например, на UTG ты уравниваешь 1 bb, а не открываешься до 2,5 bb. В кэш-игре лимп первым считается слабым ходом: забрать банк сразу ты не можешь, а игроки сзади дёшево входят следом или наказывают тебя [[Изолейт-рейз|изолейт-рейзом]]. Исключение — малый блайнд, где лимп иногда входит в стратегию. Много лимпов — частый признак [[Фиш|фиша]]."],
  ["Изолейт-рейз", "isolation raise, iso-raise, изолейт, изо, изолировать", "Изолейт-рейз — повышение против [[Лимп|лимпера]], чтобы остаться с ним один на один, лучше всего в позиции. Стандартный размер — около 4 bb против одного лимпера и ещё по 1 bb за каждого следующего. Пример: UTG залимпил, ты на CO повышаешь до 4 bb. Изолируют широко, когда лимпер слабо играет после флопа: ты получаешь [[Инициатива|инициативу]] и банк, где твоё умение играть постфлоп приносит больше."],
  ["Колд-колл", "cold call, cold-call, колдколл, холодный колл", "Колд-колл — колл рейза, когда ты ещё не вкладывал фишки в банк на этом [[Круг торговли|круге торговли]]. Например, MP открылся до 2,5 bb, а ты на баттоне просто уравниваешь. Колд-колл рискован, если за тобой остаются игроки: блайнды могут наказать тебя и опенера [[Сквиз|сквизом]]. Поэтому в 6-max многие руки вместо колд-колла играют через [[3-бет]] или фолд."],
  ["Чек-рейз", "check-raise, check raise, чекрейз, x/r, чек-рейзить", "Чек-рейз — чек, а после ставки соперника рейз на той же улице. Его делает игрок без позиции: даёт агрессору поставить и затем повышает, раздувая банк с сильной рукой или выбивая соперника блефом. Пример: ты в большом блайнде с {7h 7d}, флоп {Kc 7s 2h}, ты чекаешь, соперник ставит [[Контбет|контбет]] 2 bb, ты повышаешь до 7 bb. С [[Дро|дро]] чек-рейз работает как [[Полублеф|полублеф]]."],
  ["Контбет", "c-bet, cbet, конт-бет, продолжающая ставка, континуэйшн-бет", "Контбет — ставка на флопе от игрока с [[Инициатива|инициативой]], то есть того, кто последним повышал префлоп. Она работает, потому что соперник часто не попадает во флоп и сбрасывает. Пример: ты открылся на баттоне, большой блайнд заколлировал, флоп {Qs 8d 3c}, он чекает, ты ставишь треть банка. На [[Текстура борда|сухих бордах]] с высокими картами контбет делают часто и маленьким размером, на связанных — реже и крупнее."],
  ["Донк-бет", "donk bet, donk, донк, донкбет, лид", "Донк-бет — ставка первым ходом без позиции в игрока, который был агрессором на прошлой улице: ты не ждёшь его [[Контбет|контбета]], а ставишь сам. Пример: баттон открылся, ты защитил большой блайнд, на флопе {9h 8h 6c} ты сразу ставишь вместо чека. Раньше донк считали ошибкой новичков, но на бордах, которые сильнее попадают в [[Диапазон|диапазон]] защитника, он оправдан. Без чёткой причины чаще правильно отдать ход агрессору чеком."],
  ["Пробная ставка", "probe bet, probe, проб-бет, проб, проба", "Пробная ставка — бет без позиции на тёрне, когда префлоп-агрессор в позиции чекнул флоп и отказался от [[Контбет|контбета]]. Его чек часто означает слабую или среднюю руку, поэтому ставка нередко забирает банк сразу. Пример: CO открылся, ты заколлировал в большом блайнде, на флопе оба чекнули, на тёрне ты ставишь половину банка. Так игрок без позиции перехватывает [[Инициатива|инициативу]]."],
  ["Овербет", "overbet, овер, овербетить", "Овербет — ставка больше размера банка: в банке 20 bb, а ты ставишь 30 bb. Такой размер ставят с [[Поляризованный диапазон|поляризованным диапазоном]]: очень сильная рука или блеф, без середины. Лучше всего овербет работает, когда у тебя больше [[Натс|натсовых]] комбинаций, чем у соперника, например после [[Страшная карта|страшной карты]] на ривере, закрывшей стрит или флеш. Соперник с рукой средней силы оказывается в неудобном положении."],
  ["Блок-бет", "blocking bet, block bet, blocker bet, блокбет, блокирующая ставка", "Блок-бет — маленькая ставка без позиции, обычно 20–33% банка, чтобы самому назначить цену и не дать сопернику поставить больше. Типичная ситуация — ривер с рукой средней силы: если чекнуть, соперник может поставить крупно, и придётся решать сложный колл. Блок-бет дешевле доводит раздачу до [[Шоудаун|шоудауна]] и иногда добирает с худших рук. Минус: внимательный соперник может ответить [[Рейз|рейзом]] в блеф, ведь с сильными руками так мало обычно не ставят."],
  ["Слоуплей", "slowplay, slow play, слоуплеить, медленная игра", "Слоуплей — пассивная игра очень сильной руки: чек или колл вместо бета и рейза, чтобы скрыть силу и дать сопернику поставить или собрать вторую по силе руку. Пример: у тебя {9s 9c}, флоп {9d 4c 2h}, соперник, скорее всего, промахнулся, и ставка его отпугнёт, поэтому ты чекаешь. На связанных бордах слоуплей опасен: бесплатная карта может закрыть сопернику [[Дро|дро]]. Чаще [[Монстр|монстра]] выгоднее разыгрывать ставками и растить банк."],
  ["Стил", "steal, стилить, стилинг, кража блайндов, blind steal", "Стил — опен-рейз из поздней позиции с широким диапазоном, чтобы забрать [[Блайнды|блайнды]] без борьбы. Обычно стилят с [[Катофф|катоффа]], баттона и малого блайнда, когда до тебя все сбросили. Пример: ты на баттоне открываешься до 2,5 bb с {Kh 9c}. Банк в 1,5 bb небольшой, но частые фолды блайндов плюс [[Эквити|эквити]] руки, когда тебя заколлировали, делают стил прибыльным."],
  ["Рестил", "resteal, ре-стил, рестилить", "Рестил — [[3-бет]] против игрока, который, по твоему мнению, пытается украсть блайнды. Если баттон открывается слишком широко, ты из блайнда повышаешь даже без сильной руки, рассчитывая, что слабая часть его диапазона сбросит. Пример: баттон открылся до 2,5 bb, ты на малом блайнде делаешь 3-бет до 11 bb с {As 5s}. Чем чаще соперник идёт на [[Стил|стил]], тем выгоднее рестил."],
  ["Сквиз", "squeeze, squeeze play, сквизить, засквизить", "Сквиз — [[3-бет]] после опен-рейза и одного или нескольких [[Колл|коллов]]. Опенер оказывается зажат между тобой и коллером, а коллер своим коллом обычно показывает, что очень сильной руки у него нет, поэтому оба часто сбрасывают. Пример: CO открылся до 2,5 bb, баттон заколлировал, ты в большом блайнде повышаешь до 13 bb. Сквиз делают крупнее обычного 3-бета: за каждого коллера добавляют ещё один размер опена."],
  ["Пуш", "push, shove, пушить, запушить, шов", "Пуш — ставка всего стека, то есть [[Олл-ин|олл-ин]], сделанный по своей инициативе как бет или рейз. Чаще всего пушат с коротким стеком, например в [[Турнир|турнире]] при 10–15 bb: на манёвры после флопа фишек уже не хватает, а пуш даёт максимум [[Фолд-эквити|фолд-эквити]]. При 100 bb пуш префлоп встречается редко и почти всегда означает очень сильную руку. Если пуш перекрывает твой стек, ответить можно только коллом или фолдом."],
],
positions: [
  ["Позиция", "position, в позиции, без позиции, IP, OOP", "Позиция — твоё место за столом относительно [[Баттон|баттона]], от которого зависит [[Порядок хода|порядок хода]]. «В позиции» значит, что на флопе, тёрне и ривере ты действуешь после соперника и видишь его решение раньше, чем принимаешь своё. Это даёт больше информации, контроль над размером банка и лучшую [[Реализация эквити|реализацию эквити]]. Поэтому с поздних мест играют больше рук: с баттона открывают около 40–45%, с UTG — около 15–18%."],
  ["UTG", "under the gun, андер зе ган, ранняя позиция, EP, ЮТГ", "UTG — первая позиция после [[Большой блайнд|большого блайнда]]: она ходит первой префлоп. Название с английского значит «под прицелом»: за тобой ещё пять игроков, и у любого может оказаться сильная рука. На 6-max с UTG открывают самый узкий [[Диапазон открытия|диапазон]], около 15–18% рук: средние и крупные пары, сильные тузы, бродвеи и лучшие одномастные коннекторы. Против MP, CO и баттона после флопа ты будешь ходить первым."],
  ["MP", "middle position, средняя позиция, HJ, хайджек, hijack, мидл", "MP — средняя позиция: на 6-max это второе место после [[Большой блайнд|большого блайнда]], сразу за UTG. Её также называют хайджеком (HJ). После тебя ходят ещё четыре игрока — CO, баттон и оба блайнда, поэтому [[Диапазон открытия|диапазон открытия]] здесь чуть шире, чем с UTG, примерно 19–22% рук. В [[Фулл-ринг|фулл-ринге]] средних позиций несколько, и хайджеком там называют место прямо перед катоффом."],
  ["Катофф", "cutoff, cut-off, CO, кат-офф, катоф", "Катофф — позиция прямо перед [[Баттон|баттоном]], обозначается CO. Это вторая по выгодности позиция за столом: за тобой только баттон и блайнды, и если баттон сбросил, ты будешь в позиции на всех улицах после флопа. С катоффа открывают широко, около 27–30% рук, включая слабые одномастные тузы, большинство пар и [[Коннекторы|коннекторы]]. Отсюда же часто делают [[Стил|стил]] блайндов."],
  ["Баттон", "button, BTN, BU, дилер, кнопка, батон", "Баттон — позиция дилера, отмеченная фишкой-кнопкой, обозначается BTN. Это самое выгодное место за столом: после флопа баттон ходит последним на каждой улице и видит действия всех соперников. Поэтому с баттона играют больше всего рук: открывают около 40–45%, часто коллируют опены в [[Позиция|позиции]] и делают [[3-бет]]. После каждой раздачи кнопка сдвигается на одно место по часовой стрелке, и позиции меняются."],
  ["Малый блайнд", "small blind, SB, МБ, смол блайнд", "Малый блайнд — меньший из двух [[Блайнды|блайндов]]: обязательная ставка в 0,5 bb, которую игрок слева от баттона ставит до раздачи карт. Так же называют и саму позицию (SB). Префлоп малый блайнд ходит предпоследним, а после флопа первым, поэтому это самая невыгодная позиция. Отсюда открываются до 3 bb, а против опенов чаще играют [[3-бет]] или фолд: колл без позиции, когда сзади ещё [[Большой блайнд|большой блайнд]], обходится дорого."],
  ["Большой блайнд", "big blind, BB, ББ, биг блайнд", "Большой блайнд — обязательная ставка в 1 bb, которую ставит второй игрок слева от баттона, и сама эта позиция (BB). Его размер служит единицей измерения: стек 100 bb значит сто больших блайндов. Префлоп BB ходит последним и закрывает торговлю дешёвым коллом, поэтому против [[Стил|стила]] его защищают широко — это называют [[Защита блайндов|защитой блайндов]]. После флопа он без позиции против всех, кроме малого блайнда."],
],
hands: [
  ["Карманная пара", "pocket pair, карманка, пара в руке, покет-пара", "Карманная пара — две карты одного ранга на руках, например {7h 7d} или {Qs Qc}. Пара собрана уже префлоп, поэтому даже 22 против AK — примерно 50 на 50. Мелкие и средние пары часто разыгрывают ради [[Сет|сета]]: он приходит на флопе примерно в 12% случаев. Если сета нет, пара 55 на флопе, где все карты старше пятёрки, становится слабой рукой."],
  ["Одномастные и разномастные", "suited, offsuit, одномастка, разномастка, суитед, оффсьют", "Одномастные руки — две карты одной масти, разномастные — разных; в записи их помечают буквами s и o: AKs, AKo. Одномастность добавляет руке примерно 2–3% [[Эквити|эквити]] за счёт шанса собрать [[Флеш|флеш]], поэтому KTs открывают из большего числа позиций, чем KTo. У каждой неспаренной руки 4 одномастные [[Комбо|комбинации]] и 12 разномастных."],
  ["Коннекторы", "connectors, суитед-коннекторы, SC, связанные карты", "Коннекторы — две карты соседних рангов, например JT или 65; одномастные коннекторы вроде 98s ценятся выше. Префлоп они редко бывают сильнейшей рукой, зато собирают [[Стрит|стриты]], [[Флеш|флеши]] и сильные [[Дро|дро]], поэтому лучше всего играют в позиции и с глубокими стеками. С {8h 7h} на флопе {9h 6c 2h} у тебя одновременно открытое стрит-дро и флеш-дро."],
  ["Бродвей", "broadway, бродвейские карты, бродвей-стрит", "Бродвеем называют карты от десятки до туза, а также старший [[Стрит|стрит]] T-J-Q-K-A. Руки из двух бродвейских карт, например KQ или AJ, часто дают [[Топ-пара|топ-пару]] с хорошим кикером, а одномастные бродвеи входят в [[Диапазон открытия|диапазон открытия]] с любой позиции. С {Kd Qs} на флопе {Ah Jc 2s} до бродвей-стрита тебе не хватает только десятки."],
  ["Премиум-руки", "premium hands, премиум, топовые руки", "Премиум-руки — сильнейшие стартовые руки: обычно AA, KK, QQ, JJ и AK. Их разыгрывают агрессивно с любой позиции: открывают [[Рейз|рейзом]], отвечают [[3-бет|3-бетом]] и часто готовы поставить весь стек префлоп. Приходят они редко, примерно в 3% раздач, а сбрасывать их префлоп после одного рейза — почти всегда ошибка."],
  ["Мусорная рука", "trash hand, junk, мусор, шлак", "Мусорная рука — слабая стартовая рука почти без потенциала, например {7c 2d} или {Jh 3s}: карты разномастные, несвязанные и с низким кикером. Даже попав в пару, такая рука часто проигрывает лучшему [[Кикер|кикеру]]. Её сбрасывают префлоп почти из любой позиции; частое исключение — бесплатный чек на [[Большой блайнд|большом блайнде]], когда до тебя только [[Лимп|лимпили]]."],
  ["Доминирование", "domination, dominated, доминированная рука, доминация", "Доминирование — ситуация, когда в двух руках есть карта одного ранга, а вторая карта у одной из них старше: AK против AQ, KQ против KJ. Доминированная рука, собрав пару, всё равно проигрывает по [[Кикер|кикеру]], а её [[Эквити|эквити]] префлоп — всего около 25%. У тебя {Ad Jc}, у соперника {As Kh}, на флопе {Ac 8d 3h}: у обоих пара тузов, но впереди он благодаря королю."],
  ["Сет", "set, сетик, сет на флопе", "Сет — [[Тройка|тройка]], собранная из [[Карманная пара|карманной пары]] и одной такой же карты на борде. Его трудно заподозрить, поэтому сет часто выигрывает крупный банк у [[Топ-пара|топ-пары]] или оверпары. С {6c 6d} на флопе {Kh 6s 2c} у тебя сет шестёрок. Попасть в сет на флопе удаётся примерно в 12% случаев, то есть один раз из восьми с половиной."],
  ["Трипс", "trips, трипсы", "Трипс — [[Тройка|тройка]], собранная из одной карты в руке и пары на борде. Он заметнее [[Сет|сета]], ведь [[Спаренный борд|спаренный борд]] видят все. Кроме того, у соперника с такой же картой может оказаться кикер старше. С {Ah 9d} на флопе {9s 9c 4h} у тебя трипс девяток с тузом-кикером, а с 95 на том же флопе ты уступал бы K9 или A9."],
  ["Колесо", "wheel, велосипед, стрит от туза до пятёрки, A-5", "Колесо — самый младший [[Стрит|стрит]] A-2-3-4-5, в котором туз играет роль единицы. Туз здесь младше двойки, поэтому колесо легко проглядеть при чтении борда. При этом колесо уступает любому другому стриту: с {Ac 2d} на борде {3h 4s 5c Kd 9h} у тебя колесо, а соперник с {7d 6h} собрал стрит до семёрки и выигрывает."],
  ["Натс", "nuts, натсы, натсовая рука, орехи", "Натс — лучшая возможная рука при текущем [[Борд|борде]]: обыграть её нельзя, можно только [[Сплит|разделить]] банк. Натс меняется от улицы к улице: на флопе {Js Tc 2h} это сет валетов, а после {Qd} на тёрне — стрит с AK. С натсом на ривере думай о том, какую [[Вэлью-бет|ставку на вэлью]] соперник оплатит."],
  ["Топ-пара", "top pair, TP, ТП, старшая пара, TPTK", "Топ-пара — [[Пара|пара]] со старшей картой борда. Её сила зависит от [[Кикер|кикера]] и [[Текстура борда|текстуры борда]]: с сильным кикером на сухом флопе её смело ставят на вэлью, а со слабым на связанном борде чаще играют через чек. У тебя {Ah Qc}, на флопе {Qs 8d 3c} — топ-пара с лучшим кикером."],
  ["Оверпара", "overpair, овер-пара, оверпейр", "Оверпара — [[Карманная пара|карманная пара]] старше всех карт борда. Она бьёт любую [[Топ-пара|топ-пару]], поэтому в банке с одним рейзом её обычно разыгрывают на вэлью. Слабое место — сеты и две пары, а на связанном борде её быстро догоняют [[Дро|дро]]. С {Qh Qd} на флопе {Js 7c 3d} у тебя оверпара дам."],
  ["Средняя пара", "middle pair, мидл-пара, вторая пара", "Средняя пара — [[Пара|пара]] со второй по старшинству картой борда. У неё есть [[Шоудаун-вэлью|шоудаун-вэлью]]: она бьёт блефы, но редко выдерживает три ставки соперника. Обычно её разыгрывают через чек и колл, [[Контроль банка|не раздувая банк]]. У тебя {9c 8c}, на флопе {Kd 9h 4s} — средняя пара девяток."],
  ["Монстр", "monster, монстряк, монстер", "Монстром называют очень сильную руку, которая почти наверняка лучшая: [[Сет|сет]], стрит, флеш, фулл-хаус и выше. С монстром главная задача — выиграть как можно больше, поэтому решают, как растить банк: ставить самому, сыграть [[Чек-рейз|чек-рейз]] или изредка [[Слоуплей|замедлиться]]. С {Th Td} на флопе {Tc 7s 2h} у тебя монстр — топ-сет."],
  ["Дро", "draw, дровяная рука, недособранная рука", "Дро — недособранная рука, которой не хватает карты до сильной комбинации, обычно до стрита или флеша. Карты, которые её собирают, называют [[Ауты|аутами]], а решение о колле принимают, сравнивая шанс собраться с [[Шансы банка|шансами банка]]. Сильные дро часто разыгрывают агрессивно, как [[Полублеф|полублеф]]. С {Ah 5h} на флопе {Kh 9h 2c} у тебя флеш-дро."],
  ["Флеш-дро", "flush draw, FD, ФД, флешдро", "Флеш-дро — четыре карты одной масти, которым до [[Флеш|флеша]] не хватает пятой. У него 9 [[Ауты|аутов]]: с флопа до ривера оно собирается примерно в 35% случаев, с тёрна на ривер — в 19,6%. Дро с тузом нужной масти называют [[Натс|натсовым]]: собранный флеш будет лучшим, поэтому оно ценнее младшего. Пример: {Ah Th} на флопе {Kh 6h 2s}."],
  ["Стрит-дро", "straight draw, OESD, открытое стрит-дро, двустороннее дро, СД", "Стрит-дро — четыре карты, которым до [[Стрит|стрита]] не хватает одной. Открытое, или двустороннее, дро закрывается картой с любого края и даёт 8 [[Ауты|аутов]]: с {9c 8d} на флопе {7h 6s 2c} подойдёт любая пятёрка или десятка. С флопа до ривера оно собирается примерно в 31,5% случаев. Если не хватает карты в середине, это [[Гатшот|гатшот]] всего с 4 аутами."],
  ["Гатшот", "gutshot, внутреннее стрит-дро, гат, дырка, inside straight draw", "Гатшот — [[Стрит-дро|стрит-дро]], которому не хватает одной карты в середине. У него всего 4 [[Ауты|аута]]: с флопа до ривера он собирается примерно в 16,5% случаев, с тёрна на ривер — в 8,7%. С {Jd 8s} на флопе {Qh Tc 4d} тебе нужна только девятка. Платить крупные ставки с одним гатшотом обычно невыгодно, зато он неплохо подходит для [[Полублеф|полублефа]]."],
  ["Бэкдор-дро", "backdoor draw, бэкдор, раннер-раннер, runner-runner, BDFD", "Бэкдор-дро — [[Дро|дро]], которому до комбинации нужны две подходящие карты подряд, на тёрне и на ривере. С {Ah 7h} на флопе {Kh 9c 4d} у тебя бэкдор-флеш-дро: нужны ещё две червы. Собирается оно лишь примерно в 4% случаев, но добавляет руке [[Эквити|эквити]] и даёт повод продолжить ставить на тёрне, если пришла карта нужной масти."],
  ["Комбо-дро", "combo draw, комбинированное дро, монстр-дро, двойное дро", "Комбо-дро — рука, у которой сразу два дро, чаще всего [[Флеш-дро|флеш-дро]] и [[Стрит-дро|стрит-дро]] одновременно. [[Ауты|Аутов]] у неё 12–15, и на флопе она нередко фаворит даже против топ-пары, поэтому её охотно разыгрывают агрессивно, вплоть до олл-ина. С {Jh Th} на флопе {9h 8h 2c} у тебя 15 аутов: девять черв и ещё шесть дам и семёрок других мастей."],
  ["Ауты", "outs, аут, чистые ауты, грязные ауты", "Ауты — карты в колоде, которые улучшают твою руку так, что она, скорее всего, станет лучшей. Их считают, чтобы оценить шанс собраться и сравнить его с [[Шансы банка|шансами банка]]. С {Ah Kh} на флопе {Qh 7h 2s} у тебя 9 аутов на флеш. Если карта собирает руку тебе, но сопернику даёт ещё более сильную, такой аут считают «грязным». Перевести ауты в проценты помогает [[Правило 2 и 4|правило 2 и 4]]."],
  ["Оверкарты", "overcards, оверы, overs, две оверкарты", "Оверкарты — карты в твоей руке старше всех карт борда. Две оверкарты дают около 6 [[Ауты|аутов]] на топ-пару, и против одной пары соперника у них примерно 24% до ривера. С {Ac Kd} на флопе {9s 6h 2c} у тебя две оверкарты и пока только [[Старшая карта|старшая карта]]. На сухом флопе такие руки удобно разыгрывать [[Контбет|контбетом]]."],
  ["Блокеры", "blockers, блокер, card removal, removal, эффект блокера", "Блокеры — карты в твоей руке, которые уменьшают число сильных [[Комбо|комбинаций]] у соперника. Если у тебя туз, у соперника остаётся всего 3 комбинации AA вместо 6. Блокеры помогают выбирать руки для [[Блеф|блефа]]: с {As 5d} на борде {Ks Ts 7s 4c 2h} у соперника не может быть [[Натс|натсового]] флеша, поэтому против твоей ставки у него меньше рук, с которыми легко заплатить."],
  ["Каунтерфит", "counterfeit, каунтерфейт, обесценивание руки", "Каунтерфит — ситуация, когда новые карты борда обесценивают твою руку: комбинация формально остаётся, но одна из твоих карт перестаёт в ней работать. С {9d 8c} на флопе {9s 8h 3d} у тебя [[Две пары|две пары]], но после {Kh} на тёрне и {Kc} на ривере твоя рука — короли и девятки, а восьмёрка стала просто [[Кикер|кикером]]. Теперь тебя бьют любой король, карманные пары от десяток и девятка с кикером старше восьмёрки, хотя на флопе ты обыгрывал все эти руки."],
],
math: [
  ["Шансы банка", "pot odds, пот-оддсы, шансы пота", "Шансы банка — соотношение размера [[Банк|банка]] и суммы, которую нужно доложить для [[Колл|колла]]. Их сравнивают с твоим [[Эквити|эквити]], чтобы понять, выгоден ли колл. Пример: в банке 10 bb, соперник ставит 5 bb, банк становится 15 bb, колл стоит 5 bb — шансы 15 к 5, то есть 3 к 1. Значит, колл окупается, если ты выигрываешь хотя бы в 25% случаев: 5 bb из итоговых 20 bb."],
  ["Оддсы", "odds, шансы, коэффициент", "Оддсы — запись вероятности в виде соотношения неудач к удачам: 4 к 1 значит одна удача на пять попыток, то есть 20%. В покере так выражают шансы собрать руку и [[Шансы банка|шансы банка]]. Пример: с [[Флеш-дро|флеш-дро]] на тёрне у тебя 9 [[Ауты|аутов]] из 46 неизвестных карт, остальные 37 карт не помогают, оддсы 37 к 9, или около 4,1 к 1. В проценты: 1 / (4,1 + 1) ≈ 20%."],
  ["Эквити", "equity, доля банка, эквити руки", "Эквити — доля [[Банк|банка]], которая в среднем принадлежит тебе, если открыть все оставшиеся карты без дальнейших ставок. Проще говоря, это твой шанс выиграть банк на шоудауне, где ничья считается за половину выигрыша. Пример: {Ah Kh} против {Qs Qd} до флопа — около 46% у туза-короля и 54% у дам. Эквити сравнивают с [[Шансы банка|шансами банка]], чтобы решить, выгоден ли колл."],
  ["Реализация эквити", "equity realization, EQR, реализация", "Реализация эквити — доля [[Эквити|эквити]], которую рука на деле превращает в выигрыш с учётом будущих ставок. Без [[Позиция|позиции]] и с неудобными руками ты чаще сбрасываешь лучшую руку под давлением и реже получаешь оплату. Пример: у {9s 4d} в BB против открытия с баттона около трети эквити, но реализует она лишь часть этой доли. А {9h 8h} в позиции может реализовать даже больше 100% эквити: собрав стрит или флеш, она выигрывает крупные банки."],
  ["Матожидание", "EV, expected value, ожидаемая ценность, мат. ожидание, +EV", "Матожидание (EV) — средний результат решения, если повторять его очень много раз. Плюсовое решение приносит прибыль на дистанции, минусовое — убыток, как бы ни сложилась отдельная раздача. Пример: в банке 30 bb, ты ставишь 10 bb [[Блеф|блефом]], соперник сбрасывает в 40% случаев, а на колл ты всегда проигрываешь. EV = 0,4 × 30 − 0,6 × 10 = +6 bb. Блеф выгоден, хотя проваливается чаще, чем срабатывает."],
  ["Подразумеваемые шансы", "implied odds, имплайд оддсы, имплайды", "Подразумеваемые шансы — [[Шансы банка|шансы банка]] с учётом денег, которые ты рассчитываешь выиграть на следующих улицах, если соберёшь руку. Они позволяют платить больше, чем разрешают прямые шансы. Пример: ты коллируешь открытие 2,5 bb с {5d 5c} при стеках 100 bb ради [[Сет|сета]]. Сет приходит на флопе лишь примерно в 12% случаев, но, собрав его, ты часто выигрываешь крупный банк у [[Оверпара|оверпары]] соперника."],
  ["Обратные подразумеваемые шансы", "reverse implied odds, обратные имплайды", "Обратные подразумеваемые шансы — деньги, которые ты теряешь на следующих улицах, когда собираешь руку, а она оказывается второй по силе. Чаще всего их создают слабые [[Кикер|кикеры]], младшие флеши и стриты с нижнего конца. Пример: у тебя {Ad 9c}, флоп {Ah Kd 6s}. Если у соперника туз с лучшим кикером, ты будешь платить на каждой улице и проиграешь крупный банк, хотя попал в [[Топ-пара|топ-пару]]."],
  ["Правило 2 и 4", "rule of 2 and 4, правило двух и четырёх, 2 и 4", "Правило 2 и 4 — быстрый способ оценить шанс собрать руку: число [[Ауты|аутов]] умножают на 4 на флопе, если впереди и тёрн, и ривер, или на 2 на тёрне. Пример: [[Флеш-дро|флеш-дро]] на флопе — 9 аутов, 9 × 4 = 36% (точно около 35%), на тёрне 9 × 2 = 18% (точно около 20%). Множитель 4 подходит, только если ты точно увидишь обе карты, например при [[Олл-ин|олл-ине]] на флопе. При 12 и больше аутах правило завышает шансы: для 15 аутов оно даёт 60%, а на деле около 54%."],
  ["Фолд-эквити", "fold equity, фолдэквити, FE", "Фолд-эквити — дополнительная ценность ставки или рейза за счёт того, что соперник может сбросить карты. Она тем больше, чем чаще он сбрасывает и чем крупнее банк, который ты забираешь сразу. Пример: ты делаешь [[Полублеф|полублеф]] с [[Флеш-дро|флеш-дро]] — иногда соперник сбрасывает и банк твой, а если платит, у тебя остаются шансы собрать флеш. У колла первого пути нет. Против игрока, который никогда не сбрасывает, фолд-эквити нет."],
  ["Окупаемость блефа", "break-even, точка безубыточности блефа, порог блефа", "Окупаемость блефа — минимальная частота фолдов соперника, при которой [[Блеф|блеф]] выходит в ноль. Считается как ставка / (ставка + банк). Пример: в банке 10 bb, ты ставишь 5 bb — нужно 5 / 15 ≈ 33% фолдов. Ставка в размер банка требует 50% фолдов, ставка в треть банка — 25%. Если соперник сбрасывает чаще порога, блеф приносит прибыль с любыми картами. Чем чаще он сбрасывает, тем больше твоё [[Фолд-эквити|фолд-эквити]]."],
  ["Комбо", "combo, combos, комбинаторика", "Комбо — один конкретный вариант руки из двух карт с учётом мастей. Каждая [[Карманная пара|карманная пара]] собирается 6 способами, каждая непарная рука — 16: 4 одномастных и 12 разномастных. Подсчёт комбо показывает, какие руки в [[Диапазон|диапазоне]] соперника встречаются чаще. Пример: на борде {Kh 8s 3d} у соперника всего 3 комбо сета королей и лишь 12 комбо AK вместо 16 — один король лежит на столе."],
  ["MDF", "minimum defense frequency, минимальная частота защиты, МДФ", "MDF (минимальная частота защиты) — доля [[Диапазон|диапазона]], с которой нужно продолжать игру против ставки, чтобы соперник не получал прибыль, блефуя любыми картами. Считается как банк / (банк + ставка). Пример: в банке 10 bb, ставка 5 bb — защищать нужно 10 / 15 ≈ 67% рук, против ставки в размер банка — 50%. Это ориентир для [[Баланс|баланса]]: против игроков, которые редко [[Блеф|блефуют]], можно сбрасывать чаще."],
  ["SPR", "stack-to-pot ratio, отношение стека к банку, СПР", "SPR — отношение [[Эффективный стек|эффективного стека]] к банку на флопе. Он показывает, насколько глубоко идёт игра после флопа и легко ли довести деньги до олл-ина. Пример: ты открыл 2,5 bb, BB заколлировал — банк 5,5 bb, стеки по 97,5 bb, SPR около 18. Если же BB сделает 3-бет до 10 bb и ты заколлируешь, банк 20,5 bb, стеки по 90 bb, SPR около 4,4. При низком SPR с [[Топ-пара|топ-парой]] обычно можно идти в олл-ин, при высоком для этого нужна рука сильнее."],
  ["Эффективный стек", "effective stack, эфф. стек, эффективка", "Эффективный стек — меньший из [[Стек|стеков]] двух игроков в раздаче. Больше этой суммы никто никому проиграть не может, поэтому глубину игры, [[SPR]] и решения об [[Олл-ин|олл-ине]] считают именно по нему. Пример: у тебя 150 bb, у соперника 60 bb — эффективный стек 60 bb, и ты играешь так, будто у тебя тоже 60 bb. Против нескольких соперников его считают для каждой пары игроков отдельно."],
  ["Дисперсия", "variance, дисп, апсвинг, даунсвинг", "Дисперсия — разброс результатов вокруг ожидаемого значения, вызванный случайной раздачей карт. Из-за неё сильный игрок может проигрывать на отрезке в десятки тысяч раздач, а слабый — какое-то время выигрывать. Пример: олл-ин с {Qc Qh} против {Jd Js} — правильное решение, но ты всё равно проигрываешь примерно каждую пятую такую раздачу. Поэтому о качестве игры судят по [[Матожидание|матожиданию]] решений и [[Винрейт|винрейту]] на большой выборке."],
  ["Винрейт", "winrate, вин-рейт, bb/100", "Винрейт — средний выигрыш игрока на определённое число раздач. В [[Кэш-игра|кэш-играх]] его обычно измеряют в bb/100 — сколько больших блайндов ты выигрываешь за 100 раздач. Пример: если за 50 тысяч раздач ты выиграл 2500 bb, твой винрейт 5 bb/100. Из-за [[Дисперсия|дисперсии]] на коротком отрезке он почти ничего не говорит: даже 50 тысяч раздач дают лишь грубую оценку, а для надёжных выводов нужны сотни тысяч."],
],
strategy: [
  ["Диапазон", "range, рейндж, ренж, спектр рук", "Диапазон — набор всех рук, с которыми игрок может действовать определённым образом в данной ситуации. Сильные игроки думают не о конкретной руке соперника, а о его диапазоне, и сужают его после каждого действия. Пример: игрок на [[UTG]] открылся рейзом — у него пары, одномастные тузы, сильные бродвеи и часть одномастных коннекторов. Когда он ставит на флопе {Ks 7d 2c}, ты прикидываешь, какие руки из этого набора сыграли бы так же."],
  ["Диапазон открытия", "opening range, open range, RFI, опен-рейндж", "Диапазон открытия — руки, с которыми игрок первым входит в банк рейзом из конкретной [[Позиция|позиции]]. Чем позже позиция, тем меньше игроков осталось за тобой и тем шире диапазон. Примерные ориентиры для [[6-max]]: UTG около 15–18% рук, MP около 19–22%, CO около 27–30%, BTN 40–45%, SB около 40%. Стандартное открытие — 2,5 bb, с малого блайнда — 3 bb. Диапазоны удобно держать перед глазами в виде [[Чарт|чарта]]."],
  ["Чарт", "chart, префлоп-чарт, таблица рук, сетка 13 на 13", "Чарт — таблица 13 на 13, где отмечено, как играть каждую стартовую руку в конкретной префлоп-ситуации. Над диагональю стоят одномастные руки, под ней — разномастные, на самой диагонали — [[Карманная пара|карманные пары]]. Обычно чарты делают для каждой позиции и сценария: открытие, ответ на рейз, ответ на [[3-бет]]. Новичку чарт заменяет догадки готовым планом, пока не придёт понимание, почему руки распределены именно так."],
  ["Вэлью-бет", "value bet, вэлью, ставка на ценность, валуй-бет", "Вэлью-бет — [[Бет|ставка]] с сильной рукой в расчёте, что заплатят руки хуже. Цель — увеличить банк, который ты, скорее всего, выиграешь. Пример: у тебя {Ac Kd}, к риверу борд {Kh 9s 5c 2d 7h}. Соперник платил на флопе и тёрне — у него часто король похуже, девятки или карманные пары. Ставка в 60% банка зарабатывает именно на этих руках. Если хуже тебя никто не заплатит, ставка теряет смысл."],
  ["Тонкое вэлью", "thin value, тонкий вэлью-бет, тонкий вэлью", "Тонкое вэлью — [[Вэлью-бет|ставка на ценность]] со средней рукой, которую заплатят лишь немного более слабые руки. При колле она выигрывает ненамного чаще, чем проигрывает, и лучше всего работает против [[Колл-станция|колл-станций]]. Пример: у тебя {Qd Js}, к риверу борд {Qh 8c 6d 3s 2h}, соперник пассивно чекал. Ставка в треть банка получит колл от восьмёрок, шестёрок и дам с худшим [[Кикер|кикером]]. Против осторожного соперника здесь лучше чекнуть."],
  ["Блеф", "bluff, блефовать, чистый блеф", "Блеф — ставка или рейз со слабой рукой, чтобы соперник сбросил лучшую. Он окупается, если соперник сбрасывает чаще, чем требует [[Окупаемость блефа|порог окупаемости]]. Пример: у тебя {Jc Tc}, к риверу борд {Kc 8d 4c 3s 2h} — флеш-дро не собралось, и на шоудауне ты почти всегда проиграешь. Ставка остаётся единственным способом забрать банк. Для блефа лучше всего подходят руки без [[Шоудаун-вэлью|шоудаун-вэлью]]."],
  ["Полублеф", "semi-bluff, semibluff, полу-блеф", "Полублеф — ставка или рейз с рукой, которая сейчас, скорее всего, хуже, но может стать лучшей. Выиграть можно двумя путями: соперник сбросит сразу или ты соберёшь руку позже. Пример: у тебя {9h 8h} в BB, флоп {Th 7c 2h} — [[Комбо-дро|комбо-дро]] на флеш и стрит, соперник ставит. [[Чек-рейз]] здесь часто сильнее колла: ты используешь [[Фолд-эквити|фолд-эквити]], а если соперник заплатит, у тебя около 57% эквити даже против топ-пары."],
  ["Блеф-кэтчер", "bluff catcher, блефкэтчер, ловец блефа", "Блеф-кэтчер — рука, которая проигрывает всем [[Вэлью-бет|вэлью-ставкам]] соперника и обыгрывает только его блефы. С ней выбирают между коллом и фолдом: рейз бессмыслен, хуже не заплатят, лучше не сбросят. Пример: у тебя {Jd Jc}, борд на ривере {Ac Kh 8s 4d 2c}, соперник ставит в размер банка. Любой туз или король тебя бьёт, а выигрываешь ты у несобравшихся дро и чистого [[Блеф|блефа]]. Колл окупается, если блефов среди таких ставок хотя бы треть."],
  ["Шоудаун-вэлью", "showdown value, SDV, ценность на вскрытии", "Шоудаун-вэлью — способность руки выиграть на вскрытии без дополнительных ставок. Такие руки обычно не хотят ни блефовать, ни раздувать банк: им выгодно дойти до [[Шоудаун|шоудауна]] дёшево. Пример: у тебя {Ad 8d} на борде {Kc 8h 4s 2d 5c} — [[Средняя пара|средняя пара]] обыгрывает несобравшиеся дро и часть блефов, поэтому чек часто лучше ставки. А у {Jh Th} на том же борде шоудаун-вэлью почти нет."],
  ["Инициатива", "initiative, агрессор, префлоп-агрессор", "Инициатива — положение игрока, который последним ставил или рейзил на предыдущей улице. Ему проще продолжать агрессию: его [[Диапазон|диапазон]] обычно сильнее, а соперники часто чекают на агрессора. Пример: ты открылся с CO, BB заколлировал. На флопе он чекает, и ты как префлоп-агрессор можешь поставить [[Контбет|контбет]] даже без попадания — сильных рук у тебя больше. Колл инициативу не забирает — её перехватывает тот, кто сам ставит или рейзит."],
  ["Сайзинг", "sizing, bet sizing, размер ставки, сайз", "Сайзинг — размер ставки или рейза относительно банка или предыдущей ставки. От него зависит, какие руки соперника заплатят, какие [[Шансы банка|шансы банка]] он получит и сколько денег окажется в банке к риверу. Ориентиры: открытие 2,5 bb, [[3-бет]] примерно втрое больше открытия в позиции и вчетверо без неё, после флопа — от трети банка до банка. Маленькие ставки подходят сухим бордам, крупные — мокрым бордам и [[Поляризованный диапазон|поляризованным диапазонам]]."],
  ["Поляризованный диапазон", "polarized range, поляризация, полярный диапазон", "Поляризованный диапазон — диапазон из очень сильных рук и блефов без середины. Средние руки из него убраны: с ними выгоднее чек или колл. Такой диапазон обычно ставит крупно, вплоть до [[Овербет|овербета]], потому что сильным рукам нужен большой банк, а блефам — побольше фолдов. Пример: соперник ставит на ривере два банка — чаще всего у него либо [[Натс|натс]], либо несобравшееся дро. Противоположность — [[Линейный диапазон|линейный диапазон]]."],
  ["Линейный диапазон", "linear range, merged range, мерж, линейный", "Линейный диапазон — диапазон из лучших рук подряд, от самых сильных до средних, без слабых блефов. Его используют, когда хотят получить колл от многих худших рук. Пример: в BB против открытия с BTN ты делаешь [[3-бет]] с парами TT и старше, AK, AQ, AJs и KQs — с верхними по силе руками, каждая из которых играет на ценность. Такой подход особенно хорош против соперников, которые много коллируют. Противоположность — [[Поляризованный диапазон|поляризованный диапазон]]."],
  ["Капнутый диапазон", "capped range, кэпнутый диапазон, ограниченный диапазон", "Капнутый диапазон — диапазон, в котором почти нет самых сильных рук, потому что с ними игрок раньше действовал бы иначе. Против него выгодно давить крупными ставками. Пример: ты открыл 2,5 bb с BTN, BB просто заколлировал. AA, KK и QQ он обычно [[3-бет|3-бетит]], поэтому на флопе {Qd 7s 2c} у него почти не бывает сета дам и [[Оверпара|оверпар]], и верх его диапазона заметно слабее твоего."],
  ["Баланс", "balance, сбалансированная игра, балансировка", "Баланс — такое сочетание сильных рук и блефов в одной линии, при котором соперник не может выгодно под тебя подстроиться. Если ты ставишь крупно только с [[Натс|натсом]], тебе перестанут платить, если только блефом — начнут коллировать всё. Пример: при ставке в размер банка на ривере нужен примерно один блеф на две вэлью-руки, тогда соперник не заработает ни коллом, ни фолдом. Баланс — основа [[GTO]], а отход от него ради выгоды — [[Эксплойт|эксплойт]]."],
  ["GTO", "game theory optimal, ГТО, равновесие Нэша, теоретически оптимальная стратегия", "GTO — стратегия на основе теории игр, которую соперник не может обыграть на дистанции, как бы ни подстраивался. Она сочетает вэлью-ставки и блефы в правильных пропорциях и часто смешивает разные действия с одной и той же рукой. Такие стратегии рассчитывают программы-солверы. На практике GTO служит базой: сначала учишься играть [[Баланс|сбалансированно]], а затем отходишь от базы против слабых мест конкретного соперника — это [[Эксплойт|эксплойт]]."],
  ["Эксплойт", "exploit, эксплуатация, эксплойтативная игра", "Эксплойт — отход от сбалансированной стратегии, чтобы выжать максимум из конкретных ошибок соперника. Против того, кто слишком часто сбрасывает, ты блефуешь больше, против [[Колл-станция|колл-станции]] почти не блефуешь и ставишь на ценность шире и крупнее. Пример: [[Нит|нит]] делает рейз на ривере — у него почти всегда натс, и даже сильную руку можно сбросить. Минус эксплойта: внимательный соперник заметит перекос и подстроится."],
  ["Контроль банка", "pot control, пот-контроль, контроль пота", "Контроль банка — розыгрыш средней руки так, чтобы банк не вырос слишком сильно. Такая рука хороша против небольших ставок, но в большом банке против тебя остаются в основном руки сильнее. Обычно для этого пропускают одну из улиц чеком. Пример: у тебя {Qs Td} в позиции, флоп {Th 7c 3s}, ты поставил [[Контбет|контбет]] и получил колл. На тёрне {Kd} твоя пара стала [[Средняя пара|средней]], и чек следом за соперником держит банк небольшим."],
  ["Защита блайндов", "blind defense, дефенд блайндов, защита BB, дефенд", "Защита блайндов — колл или 3-бет из блайндов против открытий с поздних позиций, чтобы соперники не забирали блайнды слишком дёшево. [[Большой блайнд]] уже вложил 1 bb, поэтому получает хорошие [[Шансы банка|шансы банка]] и может защищаться широко. Пример: BTN открывает 2,5 bb, SB сбрасывает, тебе в BB нужно доложить 1,5 bb в банк 4 bb. Колл требует всего около 27% эквити, поэтому против такого [[Стил|стила]] защищают больше половины рук."],
  ["Флоат", "float, флоатить, флоут", "Флоат — колл ставки со слабой рукой, обычно в позиции, чтобы отобрать банк на следующих улицах. Ты рассчитываешь, что соперник часто сдаётся после флопа, и ставишь, когда он чекает тёрн. Пример: ты на BTN заколлировал открытие с CO, у тебя {Ks Qd}, флоп {9c 5h 2s}, соперник ставит [[Контбет|контбет]]. Две [[Оверкарты|оверкарты]] и [[Позиция|позиция]] позволяют заколлировать, а после чека на тёрне — поставить и забрать банк. Без позиции флоатить намного труднее."],
  ["Линия", "line, линия розыгрыша, план розыгрыша", "Линия — последовательность действий игрока на всех [[Улицы|улицах]] раздачи, например «бет — бет — чек» или «чек-колл — чек-колл — чек». По линии сужают [[Диапазон|диапазон]] соперника: каждая ставка или чек что-то говорит о руке. Пример: соперник ставит на флопе и тёрне, а на ривере чекает — так чаще играют средние руки и блефы, от которых отказались, а не монстры. Свои линии продумывай заранее, чтобы с сильными руками и блефами они выглядели одинаково."],
],
players: [
  ["Тайт и луз", "tight, loose, тайтовый, лузовый, плотный, свободный", "Тайт и луз — характеристики того, сколько рук игрок разыгрывает. Тайтовый (плотный) игрок входит в банк только с сильными руками, лузовый (свободный) играет много и часто. На 6-max тайтовым обычно считают игрока с [[VPIP и PFR|VPIP]] примерно до 24%, лузовым — от 30%. Ни одна манера сама по себе не делает игрока сильным: результат зависит от того, насколько точно он выбирает руки и сочетает ли это с [[Агрессивный и пассивный|агрессией]]."],
  ["Агрессивный и пассивный", "aggressive, passive, агрессия, агро, пассив", "Агрессивный и пассивный — характеристики того, как игрок вкладывает фишки. Агрессивный чаще ставит и рейзит, пассивный предпочитает чек и колл. Агрессия даёт два способа выиграть: соперник может сбросить карты, или ты окажешься сильнее на [[Шоудаун|шоудауне]]. Колл выигрывает только во втором случае, поэтому пассивная игра обычно приносит меньше. Вместе с осью [[Тайт и луз|тайт и луз]] эти слова дают четыре базовых стиля, например [[TAG]]."],
  ["TAG", "тайт-агрессивный, tight-aggressive, таг, тег", "TAG (тайт-агрессивный) — стиль игрока, который разыгрывает немного рук, но играет их напористо: открывает банк рейзом, ставит и редко ограничивается коллом. Новичку это лучшая основа: строгий отбор рук уберегает от трудных ситуаций, а агрессия забирает банки без шоудауна. На 6-max у типичного TAG [[VPIP и PFR|VPIP]] около 22%, PFR около 18%. Более широкая версия того же стиля — [[LAG]]."],
  ["LAG", "луз-агрессивный, loose-aggressive, лаг", "LAG (луз-агрессивный) — стиль игрока, который разыгрывает много рук и играет их агрессивно: часто открывает банк, делает [[3-бет]], давит ставками на всех улицах. В умелых руках LAG ставит соперников перед трудными решениями и забирает много банков без борьбы. Цена ошибки выше, чем у [[TAG]]: со слабыми руками легко переплатить, поэтому стиль требует опыта. Не путай его с [[Маньяк|маньяком]], который агрессивен без разбора."],
  ["Нит", "nit, нитяра, ультратайт, рок", "Нит — сверхтайтовый игрок, который редко блефует и входит в банк лишь с узким набором рук: [[Премиум-руки|премиум-руками]], парами и сильными тузами вроде AQ. Его выдаёт [[VPIP и PFR|VPIP]] около 10% и ниже. Против нита работает простая схема: чаще забирай его [[Блайнды|блайнды]], а когда он ставит или рейзит крупно, без сильной руки сбрасывай. Сам нит теряет на том, что слишком часто отдаёт банки без борьбы и почти не получает оплаты за свои сильные руки."],
  ["Маньяк", "maniac, маниак, гиперагрессивный", "Маньяк — крайне лузовый и агрессивный игрок, который ставит и рейзит почти с любыми картами. В его [[Диапазон|диапазоне]] много [[Блеф|блефа]], поэтому отвечать тем же не нужно: дай ему ставить самому, коллируй руками средней силы и рейзи по-настоящему сильными. Готовься к большой [[Дисперсия|дисперсии]]: на дистанции маньяк проигрывает, но отдельные раздачи против него бывают очень дорогими."],
  ["Колл-станция", "calling station, колл-стейшн, коллер, колл-машина, станция", "Колл-станция — пассивный игрок, который почти не сбрасывает карты после флопа и коллирует ставки с любой парой или дро. Блефовать против него бесполезно: он всё равно заплатит. Зато он щедро платит за сильные руки, поэтому основной план — [[Вэлью-бет|вэлью-беты]], включая [[Тонкое вэлью|тонкие]]. Например, с {Kh Qd} на тёрне {Kc 8s 4h 2d} ставь и сейчас, и на ривере, а не чекай из осторожности."],
  ["Фиш", "fish, рыба, любитель, рекреационный игрок", "Фиш (рыба) — слабый игрок, который проигрывает на дистанции из-за грубых ошибок: играет слишком много рук, коллирует без учёта [[Шансы банка|шансов банка]], плохо оценивает силу своей руки. Обычно это любитель, который играет ради удовольствия. Против фиша меньше блефуй и больше ставь на [[Вэлью-бет|вэлью]]: он часто платит там, где сильный игрок сбросил бы. Противоположность фиша — [[Рег|рег]]."],
  ["Рег", "reg, регуляр, регулярный игрок, регуляры", "Рег (регуляр) — постоянный игрок определённого лимита, который разбирается в стратегии и редко делает грубые ошибки. Реги часто играют на нескольких столах сразу и держатся [[TAG]]-стиля или близкого к нему. Выиграть у сильного рега трудно, поэтому основной выигрыш за столом приносит игра против [[Фиш|фишей]]. Против рега выигрывают за счёт [[Эксплойт|эксплойта]] его привычек: если он слишком часто сбрасывает на 3-бет, 3-бети его чаще."],
  ["Тильт", "tilt, тилт, на тильте, тильтовать", "Тильт — состояние, когда злость или досада после неудачных раздач ломает твою игру: ты коллируешь без оснований, блефуешь назло, разыгрываешь слишком много рук. Чаще всего тильт приходит после [[Бэд-бит|бэд-бита]] или серии [[Кулер|кулеров]]. Лучшее средство — вовремя заметить признаки и сделать перерыв. Час игры на тильте способен стереть результат многих часов нормальной игры."],
  ["Телл", "tell, теллы, тел, покерный телл", "Телл — непроизвольный сигнал в поведении игрока, который выдаёт силу его руки. Вживую это дрожь рук, взгляд на фишки после флопа, слишком быстрый или нарочито медленный колл. Онлайн теллы видны в тайминге и [[Сайзинг|размере ставок]]: например, моментальный чек часто говорит о слабости. Один телл ничего не доказывает: его учитывают вместе с действиями игрока и так складывают [[Рид|рид]]."],
  ["Рид", "read, риды, читать соперника", "Рид — вывод о том, как играет конкретный соперник или какая у него может быть рука, сделанный на основе наблюдений. Рид складывается из прошлых раздач, карт, показанных на шоудауне, [[Телл|теллов]] и статистики вроде [[VPIP и PFR]]. Например, если игрок уже дважды показывал блеф на ривере, против его ставки на ривере можно чаще коллировать [[Блеф-кэтчер|блеф-кэтчером]]. Чем больше раздач ты видел, тем надёжнее рид."],
  ["VPIP и PFR", "VPIP, PFR, ВПИП, ПФР, vpip/pfr", "VPIP и PFR — две основные статистики стиля игрока. VPIP показывает, в каком проценте раздач он добровольно вложил фишки до флопа (колл, лимп или рейз; обязательные [[Блайнды|блайнды]] не в счёт), PFR — в каком проценте он сделал рейз до флопа. Например, 22/18 — типичный [[TAG]]: играет умеренно и почти всегда рейзом. А 40/8 — пассивный лузовый игрок, часто [[Фиш|фиш]]. Большой разрыв между цифрами означает, что игрок много коллирует."],
],
formats: [
  ["Кэш-игра", "cash game, кэш, кеш, ринг, кеш-игра", "Кэш-игра — формат, в котором фишки имеют фиксированную денежную стоимость, а игрок может сесть за стол и встать из-за него в любой момент. [[Блайнды]] не растут, проигранный стек можно докупить. Стандартный стек — 100 bb, самые популярные столы — [[6-max]] и фулл-ринг на девять игроков. Результат в кэше обычно измеряют [[Винрейт|винрейтом]] в bb за 100 раздач."],
  ["Турнир", "tournament, MTT, МТТ, турик, многостоловый турнир", "Турнир — формат, где все платят одинаковый [[Бай-ин|бай-ин]], получают одинаковый стартовый стек и играют, пока не останется один победитель. [[Блайнды]] растут по расписанию, выбывшие обычно не возвращаются, а призовые получают только лучшие места. Из-за этого ценность фишек нелинейна, и в концовке решения учитывают [[ICM]]. Турниры, которые идут сразу на многих столах, называют MTT (multi-table tournament)."],
  ["Sit & Go", "SNG, сит-н-гоу, синг, сит энд гоу, сит-энд-гоу", "Sit & Go — небольшой [[Турнир|турнир]], который стартует, как только наберётся нужное число игроков, а не по расписанию. Классика — один стол на 6 или 9 человек, призовые обычно получают два или три первых места. Блайнды растут быстро, поэтому многие решения сводятся к выбору между [[Пуш|пушем]] и фолдом на коротком стеке, а ближе к призам их диктует [[ICM]]. Удобный формат, чтобы освоить турнирную игру."],
  ["Хедз-ап", "heads-up, HU, хедзап, хэдз-ап, один на один, хедс-ап", "Хедз-ап — игра один на один: стол на двоих или раздача, где в банке остались два игрока. За столом на двоих [[Баттон]] ставит [[Малый блайнд|малый блайнд]] и до флопа ходит первым, а после флопа последним. Руки здесь разыгрывают очень широко: с баттона открывают около 80% рук, а слабая пара часто оказывается лучшей рукой. Формат требует много агрессии и хорошей [[Защита блайндов|защиты блайндов]]."],
  ["6-max", "six-max, 6max, 6-макс, шестимакс, шорт-хенд, short-handed", "6-max — стол максимум на шесть игроков, один из самых популярных форматов кэш-игры. Позиции здесь: UTG, MP (он же хайджек), CO, BTN, SB и BB. Игроков меньше, чем в [[Фулл-ринг|фулл-ринге]], поэтому [[Блайнды|блайнды]] приходят чаще, а [[Диапазон открытия|диапазоны открытия]] шире: например, с UTG открывают около 16% рук, с баттона около 45%. Игра получается активнее и требует больше агрессии."],
  ["Фулл-ринг", "full ring, FR, 9-max, полный стол, фулринг", "Фулл-ринг — стол на девять или десять игроков, классический формат живого покера. По сравнению с [[6-max]] здесь больше ранних [[Позиция|позиций]] и больше соперников, которые будут действовать после тебя, поэтому ранние диапазоны заметно уже: с первой позиции открывают примерно 10% рук. Игра медленнее и тайтовее: [[Блайнды|блайнды]] приходят реже, и можно дольше ждать сильную руку."],
  ["Стек", "stack, стэк, фишки игрока, короткий стек, глубокий стек", "Стек — количество фишек, которое у игрока лежит на столе. В кэш-игре его удобно мерить в [[Большой блайнд|больших блайндах]]: стандартный стек — 100 bb, меньше 40 bb считается коротким. В раздаче решает не твой стек сам по себе, а меньший из твоего стека и стека соперника — [[Эффективный стек|эффективный стек]]. Отношение эффективного стека к банку на флопе описывает [[SPR]], и оно подсказывает, насколько легко дойти до олл-ина."],
  ["Бай-ин", "buy-in, байин, бай ин, взнос", "Бай-ин — сумма, за которую ты садишься за стол или входишь в [[Турнир|турнир]]. В [[Кэш-игра|кэш-игре]] обычно можно взять от 40 до 100 bb, и стандартом считается полный стек в 100 bb. В турнире бай-ин фиксирован и складывается из взноса в призовой фонд и комиссии организатора. Каждому лимиту соответствует свой бай-ин, поэтому [[Банкролл|банкролл]] удобно считать в бай-инах."],
  ["Рейк", "rake, комиссия, комиссия рума", "Рейк — комиссия, которую заведение или покер-рум берёт за организацию игры. В [[Кэш-игра|кэш-игре]] это небольшой процент от банка с ограничением сверху, в турнирах — часть [[Бай-ин|бай-ина]]. Рейк уменьшает выигрыш всех игроков за столом, а на низких лимитах он в пересчёте на большой блайнд выше всего и поэтому сильнее всего снижает [[Винрейт|винрейт]]."],
  ["Банкролл", "bankroll, БР, банкрол, банкролл-менеджмент, BRM", "Банкролл — деньги, которые игрок отделил от остальных средств и использует только для игры в покер. Его размер обычно выражают в [[Бай-ин|бай-инах]] выбранного лимита. Запас бай-инов нужен, потому что из-за [[Дисперсия|дисперсии]] даже сильный игрок проходит через длинные серии проигрышей. Правила, по которым под банкролл выбирают лимит, называют банкролл-менеджментом."],
  ["ICM", "Independent Chip Model, айсиэм, модель независимых фишек, ICM-давление", "ICM (Independent Chip Model) — модель, которая переводит стек игрока в долю призового фонда [[Турнир|турнира]]. Фишки, которые ты можешь проиграть, стоят дороже тех, что можешь выиграть, потому что вылет лишает тебя всех будущих выплат. Поэтому на [[Баббл|баббле]] и за финальным столом отвечать на олл-ин нужно более сильной рукой, чем подсказывают одни [[Шансы банка|шансы банка]]."],
  ["Баббл", "bubble, бабл, пузырь, баббл-бой, bubble boy", "Баббл — момент в [[Турнир|турнире]] прямо перед призовыми местами: следующий вылетевший уйдёт ни с чем, а остальные попадут в деньги. Вылет сейчас особенно дорог по [[ICM]], поэтому короткие и средние стеки играют осторожно. Крупный стек пользуется этим и давит ставками, забирая [[Блайнды|блайнды]] почти без сопротивления. Слово употребляют и шире: например, баббл финального стола."],
  ["Бэд-бит", "bad beat, бэдбит, бед-бит, бедбит", "Бэд-бит — проигрыш раздачи, в которой ты был большим фаворитом, а соперник догнал тебя на поздних улицах. Например, у тебя {As Ac}, флоп {Ad Kd 4s}, и все фишки уходят в банк против {Qh Jc} с одним [[Гатшот|гатшотом]]. Тёрн {7h}, ривер {Ts}, и у соперника [[Стрит|стрит]]. Такие проигрыши — нормальная часть [[Дисперсия|дисперсии]], а решение, принятое с хорошими шансами, на дистанции приносит прибыль."],
  ["Кулер", "cooler, кулерная раздача, сет на сет", "Кулер — раздача, где сильная рука проигрывает ещё более сильной и избежать больших потерь почти невозможно. Никто не ошибся, просто так сложились карты. Пример: у тебя {Kh Kc}, у соперника {As Ad}, и до флопа все фишки уходят в банк. Другой классический кулер — [[Сет|сет]] против старшего сета. В отличие от [[Бэд-бит|бэд-бита]], здесь соперник был фаворитом с самого начала."],
  ["Слоуролл", "slowroll, slow roll, слоу-ролл, слоурол", "Слоуролл — нарочито медленное действие с явно выигрышной рукой: долгое раздумье перед коллом с [[Натс|натсом]] или затянутый показ карт на [[Шоудаун|шоудауне]], пока соперник уже считает банк своим. Это одно из самых грубых нарушений покерного этикета. Если твоя рука точно сильнее, вскрывай её сразу. Не путай слоуролл со [[Слоуплей|слоуплеем]] — честным приёмом, когда сильную руку разыгрывают пассивно."],
],
// WIKI_DATA_END
};
const wikiNorm = s => String(s).toLowerCase().replace(/ё/g, 'е').replace(/[^a-zа-я0-9]/g, '');
const WIKI = WIKI_CATS.flatMap(([cat]) => [
  ...(cat === 'hands' ? COMBOS.map(([, t, d, ex]) => [t, '', `${d} Пример: {${ex}}.`]) : []), // комбинации — из шпаргалки
  ...(WIKI_DATA[cat] || []),
].map(([title, aliases, text]) => ({ title, cat, text, keys: [title, ...aliases.split(',')].map(wikiNorm).filter(Boolean) })));
// точное название или вариант — эта статья; иначе совпадения по началу названия, а если их нет — по тексту
function wikiFind(q) {
  const s = String(q).replace(/^\s*(что|кто)\s+(такое|такой|такая|такие|значит|это)\s+/i, '').replace(/[?!.\s]+$/, '').trim(), n = wikiNorm(s);
  if (n.length < 2) return [];
  const exact = WIKI.filter(e => e.keys.includes(n));
  if (exact.length) return exact;
  if (n.length < 3) return []; // «ок», «да» — не поиск
  const byKey = WIKI.filter(e => e.keys.some(k => k.startsWith(n) || (k.length >= 4 && n.startsWith(k))));
  const low = s.toLowerCase().replace(/ё/g, 'е');
  return byKey.length ? byKey : WIKI.filter(e => e.text.toLowerCase().replace(/ё/g, 'е').includes(low));
}

const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v && typeof v === 'object' ? v : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const settings = Object.assign({ opponents: 5, hint: 'button' }, store.get('ht-settings', {}));
let stats = Object.assign({ hands: 0, net: 0, decisions: 0, agree: 0 }, store.get('ht-stats', {}));
let G = createGame(settings.opponents);
const ui = { advice: null, hintShown: false, feedback: null, raiseTo: 0, sheetTab: 'combos', chart: null, wikiQ: '', wikiCat: '', wikiBack: [] };
let timer = null;
const hero = () => G.players[0];
const ACT_RU = { fold: 'фолд', check: 'чек', call: 'колл', raise: 'ставка или рейз' };
const signed = ch => (ch > 0 ? '+' : ch < 0 ? '−' : '') + fmt(Math.abs(ch));
const upDown = ch => ch > 0 ? 'up' : ch < 0 ? 'down' : '';
const saveStats = () => store.set('ht-stats', stats);

function cardHTML(c, cls = '') {
  const r = RANK_LABEL[rankOf(c)], s = suitOf(c);
  return `<span class="card s${s} ${cls}" role="img" aria-label="${r}${SUIT_NAME[s]}"><b>${r}</b><i>${SUIT_SYM[s]}</i></span>`;
}
const BACK = '<span class="card back" role="img" aria-label="закрытая карта"></span>';
const SLOT = '<span class="card slot" aria-hidden="true"></span>';
const mini = c => `<span class="mc s${suitOf(c)}">${RANK_LABEL[rankOf(c)]}${SUIT_SYM[suitOf(c)]}</span>`;

function raiseLabel(to) {
  const p = hero(), maxTo = p.bet + p.stack;
  if (to >= maxTo) return `Олл-ин ${fmt(maxTo)}`;

function adviceLabel(a) {

function presets() {
  const p = hero(), maxTo = p.bet + p.stack, pot = potTotal(G), cb = G.currentBet, toCall = cb - p.bet;

  if (G.street === 0) list = G.raises === 0 ? [['2,5 bb', 25], ['3 bb', 30], ['4 bb', 40]] : G.raises === 1 ? [['×3', cb * 3], ['×4', cb * 4]] : [['×2,3', cb * 2.3]];
  else list = cb === 0 ? [['⅓ банка', pot / 3], ['½', pot / 2], ['⅔', pot * 2 / 3], ['банк', pot]] : [['×2,5', cb * 2.5], ['×3', cb * 3], ['банк', cb + pot + toCall]];

    <h3>Правило 2 и 4</h3>
    <p style="font-size:13px">Умножь ауты на 4 на флопе (шанс собрать к риверу) или на 2 на тёрне (шанс на одной карте). 9 аутов флеш-дро: ≈36% с флопа, ≈18% с тёрна.</p>
    <h3>Шансы банка</h3>
    <p style="font-size:13px">Сколько процентов нужно выигрывать, чтобы колл окупался: <b>колл ÷ (банк + колл)</b>. Если твой шанс выше — коллируй, ниже — сбрасывай.</p>
    <div class="example full">Банк 10 bb, соперник ставит 5 bb. В банке стало 15 bb, тебе нужно доставить 5 bb. Нужно: 5 ÷ (15 + 5) = <b>25%</b>. У тебя флеш-дро на тёрне — 19,6%. Колл без расчёта на будущие выигрыши (подразумеваемые шансы) убыточен.</div>`;
}
function openSheet() {
  ui.chart = null;
  renderSheet();
  const d = $('#sheet'); if (!d.open) d.showModal();
}
function renderSheet() {
  document.querySelectorAll('#sheet .tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === ui.sheetTab)));
  $('#sheet-body').innerHTML = sheetHTML(ui.sheetTab, ui);
  const q = $('#sheet .wiki-q'); if (q) q.value = ui.wikiQ;
}
function openSettings() {
  $('#opp').value = String(settings.opponents);
  $('#hint-' + settings.hint).checked = true;
  renderBots();
  $('#settings').showModal();
}
function renderBots() {
  const at = new Set(G.players.map(p => p.style));
  $('#bots').innerHTML = BOT_ORDER.map(s => `<li><b>${STYLES[s].name}</b> (${STYLES[s].tag}) — ${STYLES[s].desc}${at.has(s) ? '<span class="at">за столом</span>' : ''}</li>`).join('');
}

// ---------- окна шпаргалки поверх стола ----------
const wins = []; // { tab, chart, wikiQ, wikiCat, wikiBack, min, box: {x, y, w, h}, el, html }
let zTop = 6, drag = null;
const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
const winOf = el => { const f = el.closest('.fw'); return f ? wins.find(w => w.el === f) : ui; };
const saveWins = () => store.set('ht-windows', wins.map(({ tab, box, min }) => ({ tab, box, min })));
const LANDSCAPE = '(min-aspect-ratio:4/3) and (max-height:560px) and (min-width:561px)'; // телефон лёжа, как в CSS
// высота экрана без учёта щипкового зума; в quirks-режиме clientHeight — высота всей страницы
const viewH = () => document.compatMode === 'CSS1Compat' ? document.documentElement.clientHeight : innerHeight;
function openWin(tab, init) {
  let st = wins.find(w => w.tab === tab);
  if (!st) {
    const name = $(`#sheet .tab[data-tab="${tab}"]`).textContent, n = wins.length, H = viewH();
    // лесенкой от левого верхнего угла: на телефоне видны свои карты и кнопки ходов; борд закрывает только
    // таблица рук — она нужна до флопа, когда борда ещё нет. Лёжа экран низкий — окно почти во всю высоту
    const h = matchMedia(LANDSCAPE).matches ? H - 56 : Math.min(Math.round(H * (tab === 'hands' ? .46 : .38)), 420);
    st = { tab, chart: null, wikiQ: '', wikiCat: '', wikiBack: [], min: false, box: { x: 8 + n * 24, y: 8 + n * 40, w: Math.min(document.documentElement.clientWidth - 16, 280), h } };
    st.el = document.createElement('section');
    st.el.className = 'fw';
    st.el.setAttribute('aria-label', name);
    st.el.innerHTML = `<div class="fw-head"><span class="fw-title" tabindex="0" title="Двигать — за шапку или стрелками, размер — за уголок или Shift+стрелки">${name}</span><button type="button" data-fw-min="1"></button>`
      + `<button type="button" data-fw-x="1" aria-label="Закрыть окно «${name}»">×</button></div><div class="fw-body"></div><span class="fw-size" aria-hidden="true"></span>`;
    $('#fws').append(st.el);
    wins.push(st);
  }
  Object.assign(st, init);
  setMin(st, st.min);
  renderWin(st);
  st.el.style.zIndex = ++zTop;
  saveWins();
}
function setMin(st, min) {
  const b = st.el.querySelector('[data-fw-min]');
  st.min = min;
  st.el.classList.toggle('min', min);
  b.textContent = min ? '+' : '–';
  b.setAttribute('aria-expanded', String(!min));
  b.setAttribute('aria-label', `${min ? 'Развернуть' : 'Свернуть'} окно «${st.el.getAttribute('aria-label')}»`);
  place(st);
}
// окно целиком на экране и внутри полей страницы: у самого края — жесты системы «назад» и «домой» и вырез экрана.
// Сохранённый размер не меняем — после поворота телефона окно вернётся
function place(st) {
  const W = document.documentElement.clientWidth, H = viewH(), b = st.box, s = st.el.style;
  const app = getComputedStyle($('.app')), root = getComputedStyle(document.documentElement);
  const l = parseFloat(app.paddingLeft), r = parseFloat(app.paddingRight), t = parseFloat(root.paddingTop) || 0, d = parseFloat(root.paddingBottom) || 0;
  const w = clamp(b.w, 170, W - l - r), h = clamp(b.h, 120, H - t - d);
  s.width = w + 'px'; s.height = h + 'px';
  s.left = clamp(b.x, l, W - r - w) + 'px';
  s.top = clamp(b.y, t, H - d - (st.min ? st.el.offsetHeight : h)) + 'px';
}
function renderWin(st, html = sheetHTML(st.tab, st)) {
  const body = st.el.querySelector('.fw-body'), top = body.scrollTop;
  const sel = document.activeElement?.matches('.chart-sel') && body.contains(document.activeElement);
  st.html = html; body.innerHTML = html; body.scrollTop = top;
  if (sel) body.querySelector('.chart-sel').focus({ preventScroll: true }); // иначе следующие буквы уйдут в ходы F/C/R/N
  const q = body.querySelector('.wiki-q'); if (q) q.value = st.wikiQ;
  const now = body.querySelector('.combo.now'); // своя комбинация всегда на виду, даже если окно маленькое
  if (now) {
    const r = now.getBoundingClientRect(), b = body.getBoundingClientRect();
    if (r.top < b.top || r.bottom > b.bottom) body.scrollTop += r.top - b.top - (b.height - r.height) / 2;
  }
}
// на ходах игры перерисовываем только окна, зависящие от раздачи, и только если что-то поменялось:
// в энциклопедии пропал бы фокус поиска и свернулись бы открытые статьи. Пока открыт выбор ситуации, окно не трогаем —
// иначе список закроется у тебя под пальцем; догоняем, когда он теряет фокус
function renderWins() {
  const picking = document.activeElement?.matches('.chart-sel') ? document.activeElement : null;
  for (const st of wins) if ((st.tab === 'combos' || st.tab === 'hands') && !st.el.contains(picking)) {
    const html = sheetHTML(st.tab, st);
    if (html !== st.html) renderWin(st, html);
  }
}
document.addEventListener('focusout', e => { if (e.target.matches?.('.chart-sel')) setTimeout(renderWins); });
document.addEventListener('pointerdown', e => {
  if (!e.target.closest('.fw')) return;
  const st = winOf(e.target), grip = !!e.target.closest('.fw-size');
  st.el.style.zIndex = ++zTop;
  if (drag || e.button !== 0 || !grip && (!e.target.closest('.fw-head') || e.target.closest('button'))) return;
  e.preventDefault();
  drag = { st, grip, id: e.pointerId, x: e.clientX, y: e.clientY, r: st.el.getBoundingClientRect() };
  st.el.setPointerCapture(e.pointerId);
});
document.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return; // второй палец окно не двигает
  const { st, grip, r } = drag, dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 4) return; // простое касание — не перетаскивание
  drag.moved = true;
  if (grip) st.box = { x: r.left, y: r.top, w: r.width + dx, h: r.height + dy };
  else { st.box.x = r.left + dx; st.box.y = r.top + dy; }
  place(st);
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const { st, grip, moved } = drag, r = st.el.getBoundingClientRect();
  drag = null;
  if (!moved) return; // иначе касание сохранило бы урезанное под повёрнутый экран место
  st.box.x = Math.round(r.left); st.box.y = Math.round(r.top);
  if (grip && !st.min) { st.box.w = Math.round(r.width); st.box.h = Math.round(r.height); }
  saveWins();
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);
addEventListener('resize', () => {
  wins.forEach(place);
  if (matchMedia(LANDSCAPE).matches) $('#actions').scrollIntoView({ block: 'nearest' }); // повернул телефон — кнопки ходов на виду
});

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  switch (b.id) {
    case 'a-fold': return heroAct('fold');
    case 'a-call': return heroAct(G.currentBet - hero().bet > 0 ? 'call' : 'check');
    case 'a-raise': return heroAct('raise');
    case 'next': return nextHand();
    case 'open-sheet': return openSheet();
    case 'open-settings': return openSettings();
    case 'pop-out': { // лёжа новое окно открывается свёрнутым: развёрнутое сразу закрыло бы свои карты и борд
      const tab = ui.sheetTab, fresh = !wins.some(w => w.tab === tab);
      $('#sheet').close();
      openWin(tab, { chart: ui.chart, wikiQ: ui.wikiQ, wikiBack: ui.wikiBack.slice(), min: fresh && matchMedia(LANDSCAPE).matches });
      return wins.find(w => w.tab === tab).el.querySelector('.fw-title').focus({ preventScroll: true });
    }
    case 'reset-stats': stats = { hands: 0, net: 0, decisions: 0, agree: 0 }; saveStats(); renderStats(); b.textContent = 'Статистика сброшена'; return;
  }
  if (b.dataset.reveal) { ui.hintShown = true; renderCoach(); return renderActions(); }
  if (b.dataset.why) return $('#coach').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  if (b.dataset.to) { ui.raiseTo = +b.dataset.to; return renderActions(); }
  if (b.dataset.tab) { ui.sheetTab = b.dataset.tab; return renderSheet(); }
  const st = winOf(b), show = () => st === ui ? renderSheet() : renderWin(st); // кнопка в шпаргалке или в одном из окон
  if (b.dataset.fwMin) {
    setMin(st, !st.min);
    if (!st.min && st.tab === 'combos') renderWin(st); // свёрнутое окно не прокручивалось к твоей комбинации
    return saveWins();
  }
  if (b.dataset.fwX) {
    const had = st.el.contains(document.activeElement);
    st.el.remove(); wins.splice(wins.indexOf(st), 1);
    if (had) $('#open-sheet').focus({ preventScroll: true }); // фокус не теряется вместе с окном
    return saveWins();
  }
  if (b.dataset.chart) { st.chart = b.dataset.chart; return show(); }
  if ('wcat' in b.dataset) { st.wikiCat = b.dataset.wcat; st.wikiBack = []; return show(); } // свой выбор — новый путь
  if (b.dataset.wiki || b.dataset.wikiBack) {
    const box = st === ui ? $('#sheet') : st.el.querySelector('.fw-body'); // что прокручивается
    if (b.dataset.wiki) { // запоминаем, откуда ушли по ссылке, не глубже 30 шагов
      const d = b.closest('details');
      st.wikiBack = [...st.wikiBack, { q: st.wikiQ, cat: st.wikiCat, top: box.scrollTop, from: d?.dataset.t || '',
        off: d ? d.getBoundingClientRect().top - box.getBoundingClientRect().top : 0 }].slice(-30);
      st.wikiQ = b.dataset.wiki; st.wikiCat = ''; show(); box.scrollTop = 0; return;
    }
    const p = st.wikiBack.pop();
    if (!p) return show();
    st.wikiQ = p.q; st.wikiCat = p.cat; show();
    const from = [...box.querySelectorAll('details.we')].find(d => d.dataset.t === p.from);
    if (!from) { box.scrollTop = p.top; return; }
    // статья со ссылкой снова раскрыта и стоит, где была: считаем от неё, а не от прокрутки — другие статьи
    // после перерисовки свёрнуты, а окно бывает меньше шпаргалки (поэтому не ниже середины)
    from.open = true;
    box.scrollTop += from.getBoundingClientRect().top - box.getBoundingClientRect().top - Math.min(p.off, box.clientHeight / 2);
    return;
  }
  if (b.dataset.close) b.closest('dialog').close();
});
document.addEventListener('input', e => {
  if (e.target.classList.contains('wiki-q')) { const st = winOf(e.target); st.wikiQ = e.target.value; st.wikiBack = []; e.target.parentElement.querySelector('.wiki-list').innerHTML = wikiListHTML(st); return; }
  if (e.target.id !== 'amt') return;
  ui.raiseTo = +e.target.value;
  $('#amt-out').textContent = fmt(ui.raiseTo);
  $('#a-raise').textContent = raiseLabel(ui.raiseTo);
  document.querySelectorAll('.sizing .chip').forEach(c => c.setAttribute('aria-pressed', String(+c.dataset.to === ui.raiseTo)));
});
document.addEventListener('change', e => {
  if (e.target.id === 'opp') { settings.opponents = +e.target.value; store.set('ht-settings', settings); }
  if (e.target.name === 'hint') { settings.hint = e.target.value; store.set('ht-settings', settings); renderCoach(); }
  if (e.target.classList.contains('chart-sel')) { const st = winOf(e.target); if (st !== ui) { st.chart = e.target.value || null; renderWin(st); } } // ui — список успел перерисоваться
});
document.addEventListener('keydown', e => {
  const arrow = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (arrow && e.target.classList?.contains('fw-title')) { // окно без мыши: стрелки двигают, Shift+стрелки меняют размер
    e.preventDefault();
    const st = winOf(e.target), r = st.el.getBoundingClientRect(), [dx, dy] = arrow.map(v => v * 16);
    if (!e.shiftKey) { st.box.x = r.left + dx; st.box.y = r.top + dy; }
    else if (!st.min) st.box = { x: r.left, y: r.top, w: r.width + dx, h: r.height + dy };
    place(st); return saveWins();
  }
  if (document.querySelector('dialog[open]') || e.metaKey || e.ctrlKey || e.altKey || e.target.closest('input,select,textarea')) return;
  const id = { f: 'a-fold', 'а': 'a-fold', c: 'a-call', 'с': 'a-call', r: 'a-raise', 'к': 'a-raise', n: 'next', 'т': 'next' }[e.key.toLowerCase()];
  const btn = id && document.getElementById(id);
  if (btn) { e.preventDefault(); btn.click(); }
});
$('#sheet').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });
$('#settings').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });

const savedWins = store.get('ht-windows', []), TABS = [...document.querySelectorAll('#sheet .tab')].map(t => t.dataset.tab);
if (Array.isArray(savedWins)) for (const w of savedWins) {
  if (!w || !TABS.includes(w.tab)) continue;
  const b = w.box, ok = b && [b.x, b.y, b.w, b.h].every(Number.isFinite);
  openWin(w.tab, ok ? { min: w.min === true, box: { x: b.x, y: b.y, w: b.w, h: b.h } } : { min: w.min === true });
}
nextHand();
</script>

  const tw = window.Telegram && Telegram.WebApp;
  if (!tw || !tw.initData) return;
  tw.ready(); tw.expand();
  if (tw.disableVerticalSwipes) tw.disableVerticalSwipes();
